name: Publish to crates.io

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full gate, not a subset of it. A publish is irreversible — a version number can be
  # yanked but never reused — so releasing must clear exactly what every push clears:
  # the toolchain matrix, the feature combinations, both bare-metal targets, the MSRV,
  # clippy, rustfmt and the docs build.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable

      - name: Check the tag matches the manifest version
        if: github.ref_type == 'tag'
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} would publish version ${manifest}"
            exit 1
          fi
          echo "publishing ${manifest}"

      # `--locked` builds against the committed Cargo.lock rather than whatever the
      # registry happens to resolve to at this moment.
      - name: Verify the package
        run: cargo publish --locked --dry-run

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish --locked
